# Application Configuration
spring.application.name=cleaning-system-backend
server.port=8765

# Database Configuration
# DB_PASSWORD has no default on purpose: the backend refuses to start until it is set.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cleaning_system?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.com.cleaningsystem.backend=INFO

# CORS: comma-separated list of browser origins allowed to call the API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# JSON Configuration - Use UTC for consistent timezone handling
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT Configuration
# JWT_SECRET has no default on purpose and must be at least 32 characters.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
jwt.issuer=cleaning-system-backend
jwt.token-prefix=Bearer
jwt.authorization-header=Authorization

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=0
app.upload.dir=uploads/
app.upload.max-files-per-request=5

# Work Hours Configuration
work.hours.standard=8.0
