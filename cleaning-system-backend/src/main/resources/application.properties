 # Application Configuration
spring.application.name=cleaning-system-backend
server.port=8765

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/cleaning_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Logging Configuration
logging.level.org.springframework.web=DEBUG
logging.level.com.cleaningsystem.backend=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# CORS Configuration
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# JSON Configuration - Use UTC for consistent timezone handling
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT Configuration
jwt.secret=CleaningSystemJwtSecretKey2024ForProductionUseChangeThis32CharsMinimum
jwt.expiration=2592000000
jwt.issuer=cleaning-system-backend
jwt.token-prefix=Bearer
jwt.authorization-header=Authorization

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=0
app.upload.dir=uploads/
app.upload.max-files-per-request=5

# Work Hours Configuration
work.hours.standard=8.0
